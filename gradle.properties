# NOTA: nessun org.gradle.java.home: la JDK e' scelta dal toolchain Gradle
# (jvmToolchain(21) in app/build.gradle.kts), che la scarica/seleziona da sola.
# Non impostare JAVA_HOME al JDK 27 di sistema: AGP 8.x richiede una JDK 21.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
