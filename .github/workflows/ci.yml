name: CI

on:
  push:
    branches: [main]
  pull_request:

# Il release "latest" pubblica l'APK: serve il permesso di scrittura contenuti
# per l'upload via gh release (niente segreti manuali: usa il token integrato).
permissions:
  contents: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit test e build APK
        # Il repo ha org.gradle.java.home puntato a un percorso Windows locale:
        # in CI viene overridato con il JAVA_HOME del runner (JDK 21).
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Pubblica APK sulla release "latest"
        # Solo sui push su main (non sui pull request): la release resta il
        # permalink per scaricare l'APK con firma condivisa senza passare
        # da WhatsApp/Drive (che Play Protect tende a bloccare).
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create latest --repo "$GITHUB_REPOSITORY" \
                 --title "APK piu' recente" \
                 --notes "Build automatica del branch main. Installa dal file scaricato (non da WhatsApp)."
          gh release upload latest \
            --repo "$GITHUB_REPOSITORY" \
            --clobber "app/build/outputs/apk/debug/app-debug.apk#FantaFormula1.apk"
          echo "Download: https://github.com/$GITHUB_REPOSITORY/releases/latest"
